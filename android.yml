name: Build NMRC INVENTORY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP found in repository root."
            ls -la
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf android-project
          mkdir android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 3 -type f | sort | head -100

          if [ ! -f android-project/gradlew ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "ZIP contents:"
            unzip -l "$ZIP_FILE"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip

          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline

          cp -R /tmp/android-cmdline/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd android-project

          chmod +x ./gradlew

          echo "Gradle:"
          ./gradlew --version

          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NMRC-INVENTORY-debug
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
