name: Build NMRC INVENTORY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip

          mkdir -p /tmp/android-cmdline
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -R /tmp/android-cmdline/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          chmod +x "$SDKMANAGER"

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Gradle Wrapper
        shell: bash
        run: |
          set -e

          GRADLEW="$(find . -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew file not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"

          chmod +x "$GRADLEW"

          "$GRADLEW" --version

      - name: Build NMRC INVENTORY APK
        shell: bash
        run: |
          set -e

          GRADLEW="$(find . -type f -name gradlew -print -quit)"

          PROJECT_DIR="$(dirname "$GRADLEW")"

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NMRC-INVENTORY-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
